<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aurum Hub Suomi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b12;--s:#111520;--card:#161c2d;--border:#1e2a3a;--green:#00e5a0;--blue:#38bdf8;--gold:#fbbf24;--red:#f87171;--text:#e2e8f0;--muted:#64748b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow:hidden}
input{background:var(--card);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:10px 13px;font-size:14px;outline:none;width:100%;font-family:inherit}
input:focus{border-color:var(--green)}
input::placeholder{color:var(--muted)}
button{cursor:pointer;font-weight:700;font-size:13px;border:none;border-radius:10px;padding:10px 18px;font-family:inherit}
.bp{background:linear-gradient(90deg,var(--green),var(--blue));color:#07090f;font-weight:800}
.bp.full{width:100%;padding:12px;font-size:14px}
.bg{background:rgba(255,255,255,0.07);color:var(--text)}
.lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin-bottom:5px;text-transform:uppercase}
.f{margin-bottom:10px}
.err{color:var(--red);font-size:13px;padding:8px 12px;background:rgba(248,113,113,0.1);border-radius:8px;margin:6px 0;display:none;border:1px solid rgba(248,113,113,0.15)}
.ok{color:var(--green);font-size:13px;padding:8px 12px;background:rgba(0,229,160,0.07);border-radius:8px;margin:6px 0;display:none;border:1px solid rgba(0,229,160,0.15)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:50px 20px;color:var(--muted)}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* HEADER */
#hdr{padding:11px 16px;background:var(--s);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:200;height:48px}
#logo{font-size:15px;font-weight:900;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#huser{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* SIDEBAR */
#sidebar{position:fixed;top:48px;left:0;bottom:0;width:300px;background:var(--s);border-right:1px solid var(--border);overflow-y:auto;z-index:100;padding:14px;display:none;flex-direction:column;gap:10px}
#sidebar.open{display:flex}
@media(max-width:600px){
  #sidebar{width:100%;top:48px;bottom:0;right:0}
}

/* TREE CANVAS */
#tree-area{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden}
#tree-area.with-sidebar{left:300px}
@media(max-width:600px){#tree-area.with-sidebar{left:0;top:calc(48px + 100%)}}

/* TOGGLE SIDEBAR BTN */
#toggle-btn{position:fixed;bottom:20px;right:20px;z-index:300;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));color:#07090f;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,229,160,0.3)}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat.me{background:rgba(251,191,36,0.06);border-color:rgba(251,191,36,0.2)}
.stat-n{font-size:20px;font-weight:900;color:var(--green);line-height:1}
.stat-n.g{color:var(--gold)}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}

/* LOGIN */
#login-wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:500;background:var(--bg)}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;margin:0 16px}

/* D3 TREE */
.node circle{cursor:pointer;transition:all .2s}
.node text{font-family:-apple-system,'Segoe UI',sans-serif;pointer-events:none}
.link{fill:none;stroke:rgba(0,229,160,0.25);stroke-width:1.5px}

/* TOOLTIP */
#tooltip{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:400;max-width:200px}

/* ADD FORM */
.add-section{background:rgba(0,229,160,0.04);border:1px solid rgba(0,229,160,0.13);border-radius:12px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.section-title{font-weight:700;font-size:12px;margin-bottom:8px;color:var(--green)}

/* HINT */
.hint{font-size:11px;color:var(--muted);text-align:center;padding:8px;background:rgba(255,255,255,0.03);border-radius:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">🌳</div>
      <div style="font-size:18px;font-weight:900;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Aurum Hub Suomi</div>
    </div>
    <div class="lbl">Aurum-koodi</div>
    <input id="lcode" placeholder="Syötä koodisi" style="margin-bottom:10px"/>
    <div id="lerr" class="err"></div>
    <button class="bp full" id="lbtn">Kirjaudu →</button>
  </div>
</div>

<!-- HEADER -->
<div id="hdr" style="display:none">
  <div id="logo">🌳 Aurum Hub Suomi</div>
  <div id="huser"></div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="font-weight:700;font-size:13px">Tiimi</div>
    <button class="bg" id="logout-btn" style="padding:6px 12px;font-size:12px">Ulos</button>
  </div>
  <div class="stats" id="st"></div>
  <div class="add-section">
    <div class="section-title">➕ Lisää tiimiläinen</div>
    <div class="f"><div class="lbl">Nimi</div><input id="ani" placeholder="Etu- ja sukunimi"/></div>
    <div class="grid2">
      <div class="f"><div class="lbl">Aurum-koodi</div><input id="aci" placeholder="AB1234"/></div>
      <div class="f"><div class="lbl">Suosittelijan koodi</div><input id="ari" placeholder="Kenen alla?"/></div>
    </div>
    <div id="aerr" class="err"></div>
    <div id="aok" class="ok"></div>
    <button class="bp full" id="abtn">Lisää →</button>
  </div>
  <div class="hint">🔍 Pinkki = sinä · 🏅 Kulta = johtaja<br>Klikkaa solmua avataksesi/sulkiaksesi<br>Raahaa & zoomaa puuta</div>
</div>

<!-- TREE -->
<div id="tree-area">
  <div class="loading" style="padding-top:80px"><div class="spinner"></div>Yhdistetään...</div>
</div>

<!-- FAB -->
<button id="toggle-btn" style="display:none" title="Valikko">☰</button>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmLc0bALbw8NSxaRKdWrW4JxzDFG5K89M",
  authDomain: "aurumhub-28cff.firebaseapp.com",
  databaseURL: "https://aurumhub-28cff-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aurumhub-28cff",
  storageBucket: "aurumhub-28cff.firebasestorage.app",
  messagingSenderId: "981618648558",
  appId: "1:981618648558:web:5c4e484696ebae0cfedaff"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const DEFAULT = [
  {code:"2P45R8",name:"Jenna",role:"leader",ref:""},
  {code:"84DDK4",name:"Terhi",role:"leader",ref:"2P45R8"},
  {code:"HYWPX2",name:"Minna K",role:"member",ref:"84DDK4"},
  {code:"4DX2ER",name:"Kirsi",role:"leader",ref:"HYWPX2"}
];

let WHO=null, MEMBERS=[], collapsed={};

async function initDB(){
  const snap=await get(ref(db,"members"));
  if(!snap.exists()) for(const m of DEFAULT) await set(ref(db,"members/"+m.code),m);
}
function listenMembers(cb){
  onValue(ref(db,"members"),snap=>{
    MEMBERS=snap.exists()?Object.values(snap.val()):[];
    cb();
  });
}
async function addMember(m){await set(ref(db,"members/"+m.code),m);}
async function delMember(c){await remove(ref(db,"members/"+c));}

function countDown(code){
  const ch=MEMBERS.filter(m=>m.ref===code);
  return ch.reduce((s,c)=>s+1+countDown(c.code),0);
}

function buildHierarchy(){
  // build a single root with all roots as children
  const roots=MEMBERS.filter(m=>!m.ref||m.ref==="");
  if(!roots.length) return null;
  function node(m){
    return {
      id:m.code, name:m.name, code:m.code, role:m.role,
      children: MEMBERS.filter(c=>c.ref===m.code).map(c=>node(c))
    };
  }
  if(roots.length===1) return node(roots[0]);
  return {id:"__root",name:"",code:"",role:"root",children:roots.map(r=>node(r))};
}

function gv(id){const e=document.getElementById(id);return e?e.value.trim():"";}
function showMsg(id,msg,cls){const e=document.getElementById(id);if(e){e.textContent=msg;e.className=cls;e.style.display="block";}}
function hideMsg(id){const e=document.getElementById(id);if(e)e.style.display="none";}
function showOK(id,msg){showMsg(id,msg,"ok");setTimeout(()=>hideMsg(id),4000);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

// ── D3 TREE ────────────────────────────────────────────────────────────────
let svg, g, zoom, treeLayout;

function initSVG(){
  const area=document.getElementById("tree-area");
  area.innerHTML="";
  const W=area.clientWidth||window.innerWidth;
  const H=area.clientHeight||window.innerHeight;

  svg=d3.select("#tree-area").append("svg")
    .attr("width","100%").attr("height","100%")
    .style("cursor","grab");

  g=svg.append("g");

  zoom=d3.zoom()
    .scaleExtent([0.1,3])
    .on("zoom",e=>{ g.attr("transform",e.transform); svg.style("cursor","grabbing"); })
    .on("end",()=>svg.style("cursor","grab"));

  svg.call(zoom);
  treeLayout=d3.tree().nodeSize([160,110]);
}

function drawTree(){
  if(!svg) initSVG();
  g.selectAll("*").remove();

  const data=buildHierarchy();
  if(!data) return;

  const root=d3.hierarchy(data);

  // apply collapsed state
  root.each(d=>{
    if(collapsed[d.data.id] && d.children){
      d._children=d.children; d.children=null;
    }
  });

  treeLayout(root);

  // center on root
  const area=document.getElementById("tree-area");
  const W=area.clientWidth, H=area.clientHeight;

  // links
  g.selectAll(".link")
    .data(root.links())
    .join("path")
    .attr("class","link")
    .attr("d", d3.linkVertical().x(d=>d.x).y(d=>d.y));

  // nodes
  const node=g.selectAll(".node")
    .data(root.descendants())
    .join("g")
    .attr("class","node")
    .attr("transform",d=>`translate(${d.x},${d.y})`)
    .style("cursor","pointer")
    .on("click",(e,d)=>{
      if(d.data.id==="__root") return;
      if(d.children){collapsed[d.data.id]=true;d._children=d.children;d.children=null;}
      else if(d._children){collapsed[d.data.id]=false;d.children=d._children;d._children=null;}
      drawTree();
    })
    .on("mouseover",(e,d)=>{
      if(d.data.id==="__root") return;
      const tt=document.getElementById("tooltip");
      const cnt=countDown(d.data.id);
      tt.innerHTML=`<strong>${esc(d.data.name)}</strong><br><span style="color:var(--muted);font-family:monospace">#${d.data.code}</span>${cnt?`<br><span style="color:var(--green)">${cnt} alaisuudessa</span>`:""}`;
      tt.style.opacity="1";
      tt.style.left=(e.clientX+12)+"px";
      tt.style.top=(e.clientY-10)+"px";
    })
    .on("mousemove",(e)=>{
      const tt=document.getElementById("tooltip");
      tt.style.left=(e.clientX+12)+"px";
      tt.style.top=(e.clientY-10)+"px";
    })
    .on("mouseout",()=>{ document.getElementById("tooltip").style.opacity="0"; });

  // hide virtual root node
  node.filter(d=>d.data.id==="__root").style("display","none");

  const isMe=d=>d.data.code===WHO;
  const isLdr=d=>d.data.role==="leader";
  const isRoot=d=>d.data.id==="__root";

  // circle bg
  node.filter(d=>!isRoot(d)).append("rect")
    .attr("rx",10).attr("ry",10)
    .attr("x",-58).attr("y",-24)
    .attr("width",116).attr("height",48)
    .attr("fill",d=>isMe(d)?"rgba(0,229,160,0.15)":isLdr(d)?"rgba(251,191,36,0.1)":"rgba(22,28,45,0.95)")
    .attr("stroke",d=>isMe(d)?"#00e5a0":isLdr(d)?"#fbbf24":"#1e2a3a")
    .attr("stroke-width",d=>(isMe(d)||isLdr(d))?2:1.5);

  // has children indicator
  node.filter(d=>!isRoot(d)&&(d.children||d._children)).append("circle")
    .attr("cy",24).attr("r",5)
    .attr("fill",d=>d.children?"#00e5a0":"#1e2a3a")
    .attr("stroke","#00e5a0").attr("stroke-width",1.5);

  // emoji
  node.filter(d=>!isRoot(d)).append("text")
    .attr("x",-42).attr("y",5)
    .attr("dominant-baseline","middle")
    .attr("font-size","14px")
    .text(d=>isMe(d)?"⭐":isLdr(d)?"🏅":"👤");

  // name
  node.filter(d=>!isRoot(d)).append("text")
    .attr("x",-24).attr("y",-4)
    .attr("font-size","12px")
    .attr("font-weight","700")
    .attr("fill",d=>isMe(d)?"#00e5a0":isLdr(d)?"#fbbf24":"#e2e8f0")
    .text(d=>{
      const n=d.data.name;
      return n.length>12?n.slice(0,11)+"…":n;
    });

  // code
  node.filter(d=>!isRoot(d)).append("text")
    .attr("x",-24).attr("y",10)
    .attr("font-size","10px")
    .attr("fill","#64748b")
    .attr("font-family","monospace")
    .text(d=>"#"+d.data.code);

  // initial center
  const bounds=g.node().getBBox();
  const area2=document.getElementById("tree-area");
  const W2=area2.clientWidth, H2=area2.clientHeight;
  const scale=Math.min(0.9, Math.min(W2/(bounds.width+80), H2/(bounds.height+80)));
  const tx=W2/2 - (bounds.x+bounds.width/2)*scale;
  const ty=60 - bounds.y*scale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
}

// ── STATS ──────────────────────────────────────────────────────────────────
function drawStats(){
  const el=document.getElementById("st"); if(!el) return;
  el.innerHTML="";
  MEMBERS.filter(m=>m.role==="leader").forEach(l=>{
    const cnt=countDown(l.code),isMe=l.code===WHO;
    const s=document.createElement("div");s.className="stat"+(isMe?" me":"");
    s.innerHTML=`<div class="stat-n${isMe?" g":""}">${cnt}</div><div class="stat-l">${esc(l.name)}${isMe?" ⭐":""}</div>`;
    el.appendChild(s);
  });
}

// ── UI ──────────────────────────────────────────────────────────────────────
function showApp(){
  document.getElementById("login-wrap").style.display="none";
  document.getElementById("hdr").style.display="flex";
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("toggle-btn").style.display="flex";
  document.getElementById("tree-area").classList.add("with-sidebar");
  const me=MEMBERS.find(m=>m.code===WHO);
  document.getElementById("huser").innerHTML=`<span class="live-dot"></span> ${esc(me?.name||"")} <code style="color:var(--green);font-size:10px">#${WHO}</code>`;
  drawStats(); drawTree();
}

// toggle sidebar
document.getElementById("toggle-btn").onclick=()=>{
  const sb=document.getElementById("sidebar");
  const ta=document.getElementById("tree-area");
  sb.classList.toggle("open");
  ta.classList.toggle("with-sidebar");
  setTimeout(()=>{ if(svg) drawTree(); },300);
};

document.getElementById("logout-btn").onclick=()=>{
  WHO=null;
  document.getElementById("login-wrap").style.display="flex";
  document.getElementById("hdr").style.display="none";
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("toggle-btn").style.display="none";
  document.getElementById("tree-area").classList.remove("with-sidebar");
  document.getElementById("tree-area").innerHTML='';
};

// login
const doLogin=()=>{
  const val=gv("lcode").toUpperCase();
  if(!MEMBERS.filter(m=>m.role==="leader").map(m=>m.code).includes(val)){
    showMsg("lerr","Pääsy vain johtajille.","err"); return;
  }
  WHO=val; showApp();
};
document.getElementById("lbtn").onclick=doLogin;
document.getElementById("lcode").onkeydown=e=>{ if(e.key==="Enter") doLogin(); };

// add member
document.getElementById("abtn").onclick=async()=>{
  const n=gv("ani"),c=gv("aci").toUpperCase(),r=gv("ari").toUpperCase();
  if(!n){showMsg("aerr","Nimi puuttuu.","err");return;}
  if(!c){showMsg("aerr","Koodi puuttuu.","err");return;}
  if(!r){showMsg("aerr","Suosittelijan koodi puuttuu.","err");return;}
  if(MEMBERS.find(m=>m.code===c)){showMsg("aerr","Koodi "+c+" on jo käytössä.","err");return;}
  if(!MEMBERS.find(m=>m.code===r)){showMsg("aerr","Suosittelijaa ei löydy: "+r,"err");return;}
  hideMsg("aerr");
  await addMember({code:c,name:n,role:"member",ref:r});
  document.getElementById("ani").value="";
  document.getElementById("aci").value="";
  document.getElementById("ari").value="";
  showOK("aok","✅ "+n+" lisätty!");
};

// window resize
window.addEventListener("resize",()=>{ if(WHO&&svg) drawTree(); });

// ── BOOT ──────────────────────────────────────────────────────────────────
async function boot(){
  const timer=setTimeout(()=>{
    document.getElementById("tree-area").innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:28px;margin-bottom:8px">⚠️</div><div style="font-weight:700;margin-bottom:6px;color:var(--text)">Yhteysongelma</div><div style="font-size:12px;margin-bottom:12px">Tarkista Firebase Rules: ".read":true, ".write":true</div><button class="bp" onclick="location.reload()">Yritä uudelleen</button></div>`;
  },8000);
  try{
    await initDB(); clearTimeout(timer);
    listenMembers(()=>{ if(WHO){ drawStats(); drawTree(); } });
  }catch(e){
    clearTimeout(timer);
    document.getElementById("tree-area").innerHTML=`<div style="text-align:center;padding:60px;color:var(--red)">${e.message}<br><button class="bp" style="margin-top:12px" onclick="location.reload()">Yritä uudelleen</button></div>`;
  }
}
boot();
</script>
</body>
</html>
