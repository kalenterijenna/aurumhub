<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aurum Hub Suomi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b12;--s:#111520;--card:#161c2d;--border:#1e2a3a;--green:#00e5a0;--blue:#38bdf8;--gold:#fbbf24;--red:#f87171;--text:#e2e8f0;--muted:#64748b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:60px}
#hdr{padding:12px 18px;background:var(--s);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#logo{font-size:15px;font-weight:900;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#huser{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
input{background:var(--card);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:10px 13px;font-size:14px;outline:none;width:100%;font-family:inherit}
input:focus{border-color:var(--green)}
input::placeholder{color:var(--muted)}
button{cursor:pointer;font-weight:700;font-size:13px;border:none;border-radius:10px;padding:10px 18px;font-family:inherit}
.bp{background:linear-gradient(90deg,var(--green),var(--blue));color:#07090f;font-weight:800}
.bp.full{width:100%;padding:12px;font-size:14px}
.bg{background:rgba(255,255,255,0.07);color:var(--text)}
#main{max-width:580px;margin:0 auto;padding:18px 14px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin-bottom:5px;text-transform:uppercase}
.f{margin-bottom:10px}
.err{color:var(--red);font-size:13px;padding:8px 12px;background:rgba(248,113,113,0.1);border-radius:8px;margin:6px 0;display:none;border:1px solid rgba(248,113,113,0.15)}
.ok{color:var(--green);font-size:13px;padding:8px 12px;background:rgba(0,229,160,0.07);border-radius:8px;margin:6px 0;display:none;border:1px solid rgba(0,229,160,0.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:440px){.grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat.me{background:rgba(251,191,36,0.06);border-color:rgba(251,191,36,0.2)}
.stat-n{font-size:24px;font-weight:900;color:var(--green);line-height:1}
.stat-n.g{color:var(--gold)}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:50px 20px;color:var(--muted)}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TREE ── */
.tree-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.tree-top{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
.search-wrap input{padding-left:32px;background:rgba(255,255,255,0.04);font-size:13px}
.si{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

/* node */
.ni{border-bottom:1px solid rgba(255,255,255,0.03)}
.ni:last-child{border-bottom:none}
.nr{display:flex;align-items:center;padding:8px 12px;cursor:pointer;transition:background .1s;gap:4px;min-height:48px}
.nr:hover{background:rgba(255,255,255,0.03)}
.nr:active{background:rgba(255,255,255,0.06)}

/* depth lines */
.dl{display:flex;flex-shrink:0}
.dg{width:20px;height:48px;position:relative;flex-shrink:0}
.dg.vl::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--border)}
.dg.br::before{content:'';position:absolute;left:10px;top:0;bottom:50%;width:1px;background:var(--border)}
.dg.br::after{content:'';position:absolute;left:10px;top:50%;width:10px;height:1px;background:var(--border)}
.dg.ml::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--border)}
.dg.ml::after{content:'';position:absolute;left:10px;top:50%;width:10px;height:1px;background:var(--border)}

/* toggle btn */
.nt{width:18px;height:18px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;color:var(--muted);transition:all .15s}
.nt.o{background:rgba(0,229,160,0.15);color:var(--green)}
.nsp{width:18px;flex-shrink:0}

/* avatar */
.na{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin:0 6px 0 4px}
.na.me{background:linear-gradient(135deg,rgba(0,229,160,0.2),rgba(56,189,248,0.15));border:1.5px solid var(--green)}
.na.ldr{background:rgba(251,191,36,0.1);border:1.5px solid rgba(251,191,36,0.3)}
.na.mbr{background:rgba(255,255,255,0.05);border:1px solid var(--border)}

/* info */
.nfo{flex:1;min-width:0}
.nn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nn.me{color:var(--green)}
.nn.ldr{color:var(--gold)}
.nsub{display:flex;align-items:center;gap:5px;margin-top:1px;flex-wrap:wrap}
.nc{font-size:10px;color:var(--muted);font-family:monospace}
.nb{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;text-transform:uppercase}
.nb.l{background:rgba(251,191,36,0.1);color:var(--gold);border:1px solid rgba(251,191,36,0.2)}
.nb.m{background:rgba(0,229,160,0.1);color:var(--green);border:1px solid rgba(0,229,160,0.2)}

/* right */
.nrr{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ncnt{font-size:11px;color:var(--muted);background:rgba(255,255,255,0.05);padding:2px 7px;border-radius:20px}
.ndel{width:24px;height:24px;border-radius:6px;background:transparent;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;opacity:0;border:none;padding:0;cursor:pointer;transition:all .15s;flex-shrink:0}
.nr:hover .ndel{opacity:1}
.ndel:hover{background:rgba(248,113,113,0.15);color:var(--red)}
.nch.hide{display:none}

/* login */
.lw{max-width:340px;margin:50px auto 0}
.ll{text-align:center;margin-bottom:22px}

/* add */
.aw{background:rgba(0,229,160,0.04);border:1px solid rgba(0,229,160,0.13);border-radius:14px;padding:14px 16px;margin-bottom:12px}
</style>
</head>
<body>
<div id="hdr">
  <div id="logo">🌳 Aurum Hub Suomi</div>
  <div id="huser"></div>
</div>
<div id="main"><div class="loading"><div class="spinner"></div>Yhdistetään...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmLc0bALbw8NSxaRKdWrW4JxzDFG5K89M",
  authDomain: "aurumhub-28cff.firebaseapp.com",
  databaseURL: "https://aurumhub-28cff-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aurumhub-28cff",
  storageBucket: "aurumhub-28cff.firebasestorage.app",
  messagingSenderId: "981618648558",
  appId: "1:981618648558:web:5c4e484696ebae0cfedaff"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const DEFAULT = [
  {code:"2P45R8",name:"Jenna",role:"leader",ref:""},
  {code:"84DDK4",name:"Terhi",role:"leader",ref:"2P45R8"},
  {code:"HYWPX2",name:"Minna K",role:"member",ref:"84DDK4"},
  {code:"4DX2ER",name:"Kirsi",role:"leader",ref:"HYWPX2"}
];

let WHO=null, MEMBERS=[], OPEN={}, SEARCH="";

async function initDB(){
  const snap=await get(ref(db,"members"));
  if(!snap.exists()) for(const m of DEFAULT) await set(ref(db,"members/"+m.code),m);
}
function listenMembers(cb){
  onValue(ref(db,"members"),snap=>{
    MEMBERS=snap.exists()?Object.values(snap.val()):[];
    cb();
  });
}
async function addMember(m){await set(ref(db,"members/"+m.code),m);}
async function delMember(c){await remove(ref(db,"members/"+c));}

function kids(code){return MEMBERS.filter(m=>m.ref===code);}
function countDown(code){return kids(code).reduce((s,c)=>s+1+countDown(c.code),0);}
function buildTree(code){
  const r=MEMBERS.find(m=>m.code===code); if(!r) return null;
  return {...r,children:kids(code).map(c=>buildTree(c.code)).filter(Boolean)};
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function gv(id){const e=document.getElementById(id);return e?e.value.trim():"";}
function showMsg(id,msg,cls){const e=document.getElementById(id);if(e){e.textContent=msg;e.className=cls;e.style.display="block";}}
function hideMsg(id){const e=document.getElementById(id);if(e)e.style.display="none";}
function showOK(id,msg){showMsg(id,msg,"ok");setTimeout(()=>hideMsg(id),4000);}

function render(){
  const main=document.getElementById("main"),hu=document.getElementById("huser");
  if(!WHO){hu.innerHTML="";main.innerHTML="";main.appendChild(renderLogin());return;}
  const me=MEMBERS.find(m=>m.code===WHO);
  hu.innerHTML=`<span class="live-dot"></span> ${esc(me?.name||"")} <code style="color:var(--green);font-size:10px">#${WHO}</code>`;
  main.innerHTML="";main.appendChild(renderHub());
}

function renderLogin(){
  const w=document.createElement("div");w.className="lw";
  w.innerHTML=`<div class="ll"><div style="font-size:38px;margin-bottom:6px">🌳</div><div style="font-size:20px;font-weight:900;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Aurum Hub Suomi</div></div>
  <div class="card"><div class="lbl">Aurum-koodi</div><input id="lcode" placeholder="Syötä koodisi" style="margin-bottom:10px"/>
  <div id="lerr" class="err"></div><button class="bp full" id="lbtn">Kirjaudu →</button></div>`;
  const go=()=>{
    const val=gv("lcode").toUpperCase();
    if(!MEMBERS.filter(m=>m.role==="leader").map(m=>m.code).includes(val)){showMsg("lerr","Pääsy vain johtajille.","err");return;}
    WHO=val;render();
  };
  w.querySelector("#lbtn").onclick=go;
  setTimeout(()=>{const i=document.getElementById("lcode");if(i)i.onkeydown=e=>{if(e.key==="Enter")go();};},50);
  return w;
}

function renderHub(){
  const w=document.createElement("div");

  // topbar
  const bar=document.createElement("div");
  bar.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px";
  const tl=document.createElement("div");
  tl.innerHTML=`<div style="font-weight:800;font-size:18px">Tiimin puu</div><div id="tlbl" style="font-size:11px;color:var(--muted);margin-top:1px">${MEMBERS.length} henkilöä</div>`;
  const ob=document.createElement("button");ob.className="bg";ob.textContent="Ulos";
  ob.onclick=()=>{WHO=null;render();};
  bar.appendChild(tl);bar.appendChild(ob);w.appendChild(bar);

  // stats
  const stats=document.createElement("div");stats.className="stats";stats.id="st";
  drawStats(stats);w.appendChild(stats);

  // add form
  const af=document.createElement("div");af.className="aw";
  af.innerHTML=`<div style="font-weight:700;font-size:13px;margin-bottom:10px">➕ Lisää tiimiläinen</div>
  <div class="grid">
    <div class="f"><div class="lbl">Nimi</div><input id="ani" placeholder="Etu- ja sukunimi"/></div>
    <div class="f"><div class="lbl">Aurum-koodi</div><input id="aci" placeholder="esim. AB1234"/></div>
    <div class="f"><div class="lbl">Suosittelijan koodi</div><input id="ari" placeholder="Kenen alla?"/></div>
  </div>
  <div id="aerr" class="err"></div><div id="aok" class="ok"></div>
  <button class="bp full" id="abtn">Lisää puuhun →</button>`;
  af.querySelector("#abtn").onclick=async()=>{
    const n=gv("ani"),c=gv("aci").toUpperCase(),r=gv("ari").toUpperCase();
    if(!n){showMsg("aerr","Nimi puuttuu.","err");return;}
    if(!c){showMsg("aerr","Koodi puuttuu.","err");return;}
    if(!r){showMsg("aerr","Suosittelijan koodi puuttuu.","err");return;}
    if(MEMBERS.find(m=>m.code===c)){showMsg("aerr","Koodi "+c+" on jo käytössä.","err");return;}
    if(!MEMBERS.find(m=>m.code===r)){showMsg("aerr","Suosittelijaa ei löydy: "+r,"err");return;}
    hideMsg("aerr");
    await addMember({code:c,name:n,role:"member",ref:r});
    OPEN[r]=true;
    document.getElementById("ani").value="";
    document.getElementById("aci").value="";
    document.getElementById("ari").value="";
    showOK("aok","✅ "+n+" lisätty!");
  };
  w.appendChild(af);

  // tree box
  const tb=document.createElement("div");tb.className="tree-box";
  tb.innerHTML=`<div class="tree-top"><div style="font-weight:700;font-size:13px">Jäsenet</div><div style="font-size:11px;color:var(--muted)">Klikkaa avataksesi</div></div>
  <div class="search-wrap"><span class="si">🔍</span><input id="srch" placeholder="Hae nimellä tai koodilla..."/></div>`;
  const tbody=document.createElement("div");tbody.id="tbody";
  tb.appendChild(tbody);w.appendChild(tb);

  setTimeout(()=>{
    const si=document.getElementById("srch");
    if(si) si.oninput=e=>{SEARCH=e.target.value.toLowerCase();drawTree();};
  },50);

  function drawStats(el){
    el.innerHTML="";
    MEMBERS.filter(m=>m.role==="leader").forEach(l=>{
      const cnt=countDown(l.code),isMe=l.code===WHO;
      const s=document.createElement("div");s.className="stat"+(isMe?" me":"");
      s.innerHTML=`<div class="stat-n${isMe?" g":""}">${cnt}</div><div class="stat-l">${esc(l.name)}${isMe?" ⭐":""}</div>`;
      el.appendChild(s);
    });
    const tl2=document.getElementById("tlbl");if(tl2)tl2.textContent=MEMBERS.length+" henkilöä";
  }

  function matches(node){
    if(!SEARCH)return true;
    if(node.name.toLowerCase().includes(SEARCH))return true;
    if(node.code.toLowerCase().includes(SEARCH))return true;
    return node.children?.some(c=>matches(c));
  }

  function drawTree(){
    const tb2=document.getElementById("tbody");if(!tb2)return;
    tb2.innerHTML="";
    const roots=MEMBERS.filter(m=>!m.ref||m.ref==="");
    if(!roots.length){tb2.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">Ei jäseniä.</div>';return;}
    roots.forEach(r=>{const t=buildTree(r.code);if(t)drawNode(tb2,t,0,[]);});
  }

  function drawNode(parent,node,depth,ancestors){
    if(!matches(node))return;
    const isMe=node.code===WHO,isLdr=node.role==="leader";
    const hasKids=node.children?.length>0;
    // default: open first 2 levels
    if(OPEN[node.code]===undefined) OPEN[node.code]=depth<2;
    const isOpen=OPEN[node.code];

    const wrap=document.createElement("div");wrap.className="ni";

    // row
    const row=document.createElement("div");row.className="nr";

    // depth lines
    const dl=document.createElement("div");dl.className="dl";
    ancestors.forEach((hasMore,i)=>{
      const g=document.createElement("div");
      const isLast=i===ancestors.length-1;
      g.className="dg "+(isLast?(hasMore?"ml":"br"):"vl");
      dl.appendChild(g);
    });
    row.appendChild(dl);

    // toggle
    if(hasKids){
      const t=document.createElement("div");t.className="nt"+(isOpen?" o":"");t.textContent=isOpen?"▾":"▸";
      row.appendChild(t);
    } else {
      const sp=document.createElement("div");sp.className="nsp";row.appendChild(sp);
    }

    // avatar
    const av=document.createElement("div");av.className="na "+(isMe?"me":isLdr?"ldr":"mbr");
    av.textContent=isMe?"⭐":isLdr?"🏅":"👤";row.appendChild(av);

    // info
    const info=document.createElement("div");info.className="nfo";
    const nm=document.createElement("div");nm.className="nn"+(isMe?" me":isLdr?" ldr":"");nm.textContent=node.name;
    const sub=document.createElement("div");sub.className="nsub";
    sub.innerHTML=`<span class="nc">#${node.code}</span>`;
    if(isLdr)sub.innerHTML+=`<span class="nb l">Johtaja</span>`;
    if(isMe)sub.innerHTML+=`<span class="nb m">Sinä</span>`;
    info.appendChild(nm);info.appendChild(sub);row.appendChild(info);

    // right
    const rr=document.createElement("div");rr.className="nrr";
    if(hasKids){const cnt=document.createElement("div");cnt.className="ncnt";cnt.textContent=countDown(node.code);rr.appendChild(cnt);}
    if(!isLdr){
      const del=document.createElement("button");del.className="ndel";del.textContent="×";
      del.onclick=async e=>{
        e.stopPropagation();
        if(!confirm("Poista "+node.name+"?"))return;
        if(MEMBERS.some(m=>m.ref===node.code)){alert("Ei voi poistaa — alaisuudessa on ihmisiä.");return;}
        await delMember(node.code);
      };
      rr.appendChild(del);
    }
    row.appendChild(rr);
    wrap.appendChild(row);

    // children
    if(hasKids){
      const ch=document.createElement("div");ch.className="nch"+(isOpen?"":" hide");
      node.children.forEach((c,i)=>drawNode(ch,c,depth+1,[...ancestors,i<node.children.length-1]));
      wrap.appendChild(ch);
      row.onclick=()=>{OPEN[node.code]=!isOpen;drawTree();};
    }
    parent.appendChild(wrap);
  }

  w._refresh=()=>{
    const s=document.getElementById("st");if(s)drawStats(s);
    drawTree();
  };
  drawTree();
  return w;
}

async function boot(){
  const timer=setTimeout(()=>{
    document.getElementById("main").innerHTML=`<div class="card" style="max-width:340px;margin:40px auto;text-align:center"><div style="font-size:28px;margin-bottom:8px">⚠️</div><div style="font-weight:700;margin-bottom:6px">Yhteysongelma</div><div style="color:var(--muted);font-size:12px;margin-bottom:12px">Tarkista Firebase Rules: ".read":true, ".write":true</div><button class="bp full" onclick="location.reload()">Yritä uudelleen</button></div>`;
  },8000);
  try{
    await initDB();clearTimeout(timer);
    listenMembers(()=>{
      const hub=document.querySelector("#main>div");
      if(WHO&&hub?._refresh)hub._refresh();
      else render();
    });
  }catch(e){
    clearTimeout(timer);
    document.getElementById("main").innerHTML=`<div class="card" style="max-width:340px;margin:40px auto;text-align:center"><div style="color:var(--red);margin-bottom:10px">${e.message}</div><button class="bp full" onclick="location.reload()">Yritä uudelleen</button></div>`;
  }
}
boot();
</script>
</body>
</html>
