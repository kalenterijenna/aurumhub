<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aurum Hub Suomi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;padding-bottom:60px}
input{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);border-radius:8px;color:#e2e8f0;padding:9px 13px;font-size:14px;outline:none;width:100%}
input::placeholder{color:rgba(255,255,255,0.3)}
button{cursor:pointer;font-weight:700;font-size:13px;border:none;border-radius:8px;padding:9px 18px;font-family:inherit}
.btn-g{background:linear-gradient(90deg,#00e5a0,#38bdf8);color:#07090f;font-weight:800}
.btn-g.full{width:100%;padding:12px;font-size:15px}
.btn-soft{background:rgba(255,255,255,0.08);color:#e2e8f0}
#hdr{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between}
#logo{font-size:18px;font-weight:900;background:linear-gradient(90deg,#00e5a0,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#huser{font-size:12px;color:rgba(255,255,255,0.4)}
#main{max-width:900px;margin:0 auto;padding:28px 18px 0}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:.8px;margin-bottom:5px;text-transform:uppercase}
.field{margin-bottom:10px}
.err{color:#f87171;font-size:13px;padding:7px 11px;background:rgba(248,113,113,0.1);border-radius:7px;margin:6px 0;display:none}
.ok{color:#00e5a0;font-size:13px;padding:7px 11px;background:rgba(0,229,160,0.08);border-radius:7px;margin:6px 0;display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:140px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:100px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:11px;padding:14px 16px;text-align:center}
.stat.me{background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.3)}
.stat-n{font-size:28px;font-weight:900;color:#00e5a0;line-height:1}
.stat-n.gold{color:#fbbf24}
.stat-l{font-size:12px;color:rgba(255,255,255,0.4);margin-top:3px}
.loading{text-align:center;padding:40px;color:rgba(255,255,255,0.4);font-size:14px}
/* TREE */
.tree-scroll{overflow-x:auto;padding:10px 0 4px}
.tree-root{display:flex;justify-content:center;list-style:none;padding:0;margin:0}
.t-li{display:flex;flex-direction:column;align-items:center;position:relative;padding:0 6px}
.t-li::before,.t-li::after{content:'';position:absolute;top:0;width:50%;height:2px;background:rgba(0,229,160,0.28)}
.t-li::before{left:0}.t-li::after{right:0}
.t-li:first-child::before,.t-li:last-child::after{display:none}
.t-connector{width:2px;height:20px;background:rgba(0,229,160,0.28);flex-shrink:0}
.t-root-connector{display:none}
.t-node{position:relative;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 12px;min-width:100px;max-width:150px;text-align:center;flex-shrink:0}
.t-node.me{background:linear-gradient(135deg,rgba(0,229,160,0.18),rgba(56,189,248,0.12));border-color:#00e5a0}
.t-node.ldr{background:rgba(251,191,36,0.09);border-color:rgba(251,191,36,0.38)}
.t-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-code{font-size:10px;color:rgba(255,255,255,0.38);font-family:monospace;letter-spacing:.5px;margin-top:2px}
.t-badge{font-size:9px;font-weight:700;color:#fbbf24;border:1px solid rgba(251,191,36,0.45);border-radius:4px;padding:1px 4px;margin-top:3px;display:inline-block}
.t-down{width:2px;height:20px;background:rgba(0,229,160,0.28);flex-shrink:0}
.t-children{display:flex;list-style:none;padding:0;margin:0;position:relative}
.t-children::before{content:'';position:absolute;top:0;left:50px;right:50px;height:2px;background:rgba(0,229,160,0.28)}
.t-children.single::before{display:none}
.t-del{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#f87171;color:#fff;font-size:11px;font-weight:900;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;line-height:1}
.t-node:hover .t-del{display:flex}
.live-dot{display:inline-block;width:7px;height:7px;background:#00e5a0;border-radius:50%;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div id="hdr">
  <div id="logo">🌳 Aurum Hub Suomi</div>
  <div id="huser"></div>
</div>
<div id="main"><div class="loading">Yhdistetään...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase config ───────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBmLc0bALbw8NSxaRKdWrW4JxzDFG5K89M",
  authDomain: "aurumhub-28cff.firebaseapp.com",
  databaseURL: "https://aurumhub-28cff-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aurumhub-28cff",
  storageBucket: "aurumhub-28cff.firebasestorage.app",
  messagingSenderId: "981618648558",
  appId: "1:981618648558:web:5c4e484696ebae0cfedaff"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── Default data ──────────────────────────────────────────────────────────────
const LEADERS = ["2P45R8","84DDK4","4DX2ER"];
const DEFAULT_MEMBERS = [
  {code:"2P45R8", name:"Jenna",   role:"leader", ref:""},
  {code:"84DDK4", name:"Terhi",   role:"leader", ref:"2P45R8"},
  {code:"HYWPX2", name:"Minna K", role:"member", ref:"84DDK4"},
  {code:"4DX2ER", name:"Kirsi",   role:"leader", ref:"HYWPX2"}
];

// ── State ─────────────────────────────────────────────────────────────────────
let WHO = null;
let MEMBERS = [];

// ── Firebase helpers ──────────────────────────────────────────────────────────
async function initDB() {
  const snap = await get(ref(db, "members"));
  if (!snap.exists()) {
    // First time — write defaults
    for (const m of DEFAULT_MEMBERS) {
      await set(ref(db, "members/" + m.code), m);
    }
  }
}

function listenMembers(callback) {
  onValue(ref(db, "members"), (snap) => {
    const data = snap.val() || {};
    MEMBERS = Object.values(data);
    callback();
  });
}

async function addMember(m) {
  await set(ref(db, "members/" + m.code), m);
}

async function deleteMember(code) {
  await remove(ref(db, "members/" + code));
}

// ── Tree helpers ──────────────────────────────────────────────────────────────
function buildTree(code) {
  const r = MEMBERS.find(m => m.code === code);
  if (!r) return null;
  return { ...r, children: MEMBERS.filter(m => m.ref === code).map(c => buildTree(c.code)).filter(Boolean) };
}
function countAll(n) {
  if (!n?.children?.length) return 0;
  return n.children.reduce((s,c) => s + 1 + countAll(c), 0);
}
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── DOM helpers ───────────────────────────────────────────────────────────────
function gv(id) { const e = document.getElementById(id); return e ? e.value.trim() : ""; }
function showE(id,msg) { const e=document.getElementById(id); if(e){e.textContent=msg;e.style.display="block";} }
function hideE(id) { const e=document.getElementById(id); if(e) e.style.display="none"; }
function showOK(id,msg) { const e=document.getElementById(id); if(e){e.textContent=msg;e.style.display="block";setTimeout(()=>e.style.display="none",4000);} }

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById("main");
  const hu   = document.getElementById("huser");
  main.innerHTML = "";
  if (!WHO) {
    hu.innerHTML = "";
    main.appendChild(renderLogin());
  } else {
    const me = MEMBERS.find(m => m.code === WHO);
    hu.innerHTML = `<span class="live-dot"></span>${me?.name || ""} &nbsp;<code style="color:#00e5a0">#${WHO}</code>`;
    main.appendChild(renderHub());
  }
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin() {
  const w = document.createElement("div");
  w.innerHTML = `
    <div class="card" style="max-width:400px;margin:0 auto">
      <h2 style="font-weight:800;font-size:22px;margin-bottom:4px">Tervetuloa 🌳</h2>
      <p style="color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:18px">Johtajat kirjautuvat omalla Aurum-koodilla</p>
      <div class="lbl">Aurum-koodi</div>
      <input id="lcode" placeholder="Syötä koodisi" style="margin-bottom:10px"/>
      <div class="err" id="lerr"></div>
      <button class="btn-g full" id="lbtn">Kirjaudu →</button>
    </div>`;
  const doLogin = () => {
    const val = gv("lcode").toUpperCase();
    const leaders = MEMBERS.filter(m => m.role==="leader").map(m => m.code);
    if (!leaders.includes(val)) { showE("lerr","Pääsy vain johtajille. Tarkista koodi."); return; }
    WHO = val; render();
  };
  w.querySelector("#lbtn").onclick = doLogin;
  setTimeout(() => {
    const i = document.getElementById("lcode");
    if (i) i.onkeydown = e => { if(e.key==="Enter") doLogin(); };
  }, 50);
  return w;
}

// ── HUB ───────────────────────────────────────────────────────────────────────
function renderHub() {
  const w = document.createElement("div");

  // header
  const hdr = document.createElement("div");
  hdr.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:16px";
  const hl = document.createElement("div");
  hl.id = "hub-title";
  hl.innerHTML = `<div style="font-weight:800;font-size:20px">Tiimin puu</div><div style="font-size:12px;color:rgba(255,255,255,0.38);margin-top:2px">${MEMBERS.length} henkilöä yhteensä</div>`;
  const ob = document.createElement("button");
  ob.className = "btn-soft"; ob.textContent = "Kirjaudu ulos";
  ob.onclick = () => { WHO = null; render(); };
  hdr.appendChild(hl); hdr.appendChild(ob);
  w.appendChild(hdr);

  // stats
  const stats = document.createElement("div");
  stats.className = "stats";
  stats.id = "hub-stats";
  renderStats(stats);
  w.appendChild(stats);

  // add form
  const form = document.createElement("div");
  form.className = "card";
  form.innerHTML = `
    <div style="font-weight:700;font-size:14px;margin-bottom:12px">➕ Lisää tiimiläinen</div>
    <div class="row">
      <div class="field"><div class="lbl">Nimi</div><input id="ani" placeholder="Etu- ja sukunimi"/></div>
      <div class="field"><div class="lbl">Aurum-koodi</div><input id="aci" placeholder="esim. AB1234"/></div>
      <div class="field"><div class="lbl">Suosittelijan koodi</div><input id="ari" placeholder="Kenen alla?"/></div>
    </div>
    <div class="err" id="aerr"></div>
    <div class="ok"  id="aok"></div>
    <button class="btn-g full" id="abtn">Lisää puuhun →</button>`;
  form.querySelector("#abtn").onclick = async () => {
    const n=gv("ani"), c=gv("aci").toUpperCase(), r=gv("ari").toUpperCase();
    if (!n) { showE("aerr","Nimi puuttuu."); return; }
    if (!c) { showE("aerr","Koodi puuttuu."); return; }
    if (!r) { showE("aerr","Suosittelijan koodi puuttuu."); return; }
    if (MEMBERS.find(m => m.code===c)) { showE("aerr","Koodi "+c+" on jo käytössä."); return; }
    if (!MEMBERS.find(m => m.code===r)) { showE("aerr","Suosittelijaa ei löydy: "+r); return; }
    hideE("aerr");
    await addMember({code:c, name:n, role:"member", ref:r});
    document.getElementById("ani").value="";
    document.getElementById("aci").value="";
    document.getElementById("ari").value="";
    showOK("aok","✅ "+n+" lisätty! Puu päivittyy automaattisesti.");
  };
  w.appendChild(form);

  // tree
  const tc = document.createElement("div");
  tc.className = "card";
  const tscroll = document.createElement("div");
  tscroll.className = "tree-scroll";
  tscroll.id = "tree-scroll";
  tc.appendChild(tscroll);
  w.appendChild(tc);

  renderTree(tscroll);
  return w;
}

function renderStats(el) {
  el.innerHTML = "";
  MEMBERS.filter(m => m.role==="leader").forEach(l => {
    const t = buildTree(l.code), cnt = t ? countAll(t) : 0, isMe = l.code===WHO;
    const s = document.createElement("div");
    s.className = "stat"+(isMe?" me":"");
    s.innerHTML = `<div class="stat-n${isMe?" gold":""}">${cnt}</div><div class="stat-l">${esc(l.name)}${isMe?" ⭐":""}</div>`;
    el.appendChild(s);
  });
}

function renderTree(container) {
  container.innerHTML = "";
  const roots = MEMBERS.filter(m => !m.ref || m.ref==="");
  if (!roots.length) {
    container.innerHTML = '<div style="color:rgba(255,255,255,0.38);font-size:14px;padding:8px">Ei vielä jäseniä.</div>';
    return;
  }
  const ul = document.createElement("ul");
  ul.className = "tree-root";
  roots.forEach(r => {
    const t = buildTree(r.code);
    if (t) ul.appendChild(makeLi(t, true));
  });
  container.appendChild(ul);
}

function makeLi(node, isRoot) {
  const li = document.createElement("li");
  li.className = "t-li";
  const isMe = node.code===WHO, isLdr = node.role==="leader";

  const conn = document.createElement("div");
  conn.className = isRoot ? "t-root-connector" : "t-connector";
  li.appendChild(conn);

  const box = document.createElement("div");
  box.className = "t-node"+(isMe?" me":isLdr?" ldr":"");
  box.innerHTML = `
    <div class="t-name">${isMe?"⭐ ":isLdr?"🏅 ":""}${esc(node.name)}</div>
    <div class="t-code">#${node.code}</div>
    ${isLdr?'<div class="t-badge">Johtaja</div>':''}
    ${!isLdr?'<button class="t-del" title="Poista">×</button>':''}`;

  const delBtn = box.querySelector(".t-del");
  if (delBtn) {
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("Poista "+node.name+"?")) return;
      if (MEMBERS.some(m => m.ref===node.code)) { alert("Ei voi poistaa — henkilöllä on alaisuudessaan ihmisiä."); return; }
      await deleteMember(node.code);
    };
  }
  li.appendChild(box);

  if (node.children?.length) {
    const down = document.createElement("div");
    down.className = "t-down";
    li.appendChild(down);
    const ul = document.createElement("ul");
    ul.className = "t-children"+(node.children.length===1?" single":"");
    node.children.forEach(c => ul.appendChild(makeLi(c, false)));
    li.appendChild(ul);
  }
  return li;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  await initDB();
  // Listen for real-time changes — rerenders automatically for everyone
  listenMembers(() => {
    if (WHO) {
      // refresh tree and stats without full re-render (keeps form inputs)
      const ts = document.getElementById("tree-scroll");
      const st = document.getElementById("hub-stats");
      const ht = document.getElementById("hub-title");
      if (ts) renderTree(ts);
      if (st) renderStats(st);
      if (ht) ht.innerHTML = `<div style="font-weight:800;font-size:20px">Tiimin puu</div><div style="font-size:12px;color:rgba(255,255,255,0.38);margin-top:2px">${MEMBERS.length} henkilöä yhteensä</div>`;
    } else {
      render();
    }
  });
}

boot();
</script>
</body>
</html>
